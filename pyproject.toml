[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shrimp-microbiota"
version = "1.0.0"
description = "Validated bacterial detection heatmaps for whiteleg shrimp"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "openpyxl==3.1.5",
]

[project.scripts]
shrimp-heatmap = "shrimp_microbiota.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
